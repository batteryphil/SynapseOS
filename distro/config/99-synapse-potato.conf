# ==============================================================================
# SynapseOS Potato Hardware & AI Workstation Kernel Tuning
# Installed to: /etc/sysctl.d/99-synapse-potato.conf
# ==============================================================================

# 1. Balanced LZ4 ZRAM swappiness: compresses cold OS/Python heap pages (~3:1 ratio)
#    while keeping high-entropy Q4_K_M LLM mmap/mlock weights pinned in physical RAM
#    to prevent per-token ZRAM decompression thrashing.
vm.swappiness = 25

# 2. Single-page swap-in for zero latency spikes on compressed RAM ZRAM reads
vm.page-cluster = 0

# 3. Retain directory and inode caches in RAM for instant Python & SQLite FTS5 lookups
vm.vfs_cache_pressure = 50

# 4. Prevent dirty disk writes from stalling interactive UI threads
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# 5. Fair task-group scheduling so 100% CPU AI training never freezes the X11/Openbox mouse cursor
kernel.sched_autogroup_enabled = 1

# 6. Allow memory-mapped GGUF model files (llama.cpp / Ollama --mmap)
vm.max_map_count = 262144
