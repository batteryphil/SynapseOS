# ==============================================================================
# SynapseOS Zero-RAM Auto-Login Drop-In
# Installed to: /etc/systemd/system/getty@tty1.service.d/autologin.conf
# Eliminates 60MB+ Display Manager (GDM/LightDM) overhead on potato hardware.
# ==============================================================================

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin synapse --noclear %I $TERM
